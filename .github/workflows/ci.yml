name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported (tomllib) and the newest.
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # Sync first, without PYTHONWARNINGS: it reaches the build backend
      # too, and turns setuptools' editable-install notice into a failure.
      - name: sync
        run: uv sync --locked --python ${{ matrix.python }}
      - name: unittest
        env:
          PYTHONWARNINGS: error
        run: uv run --locked --no-sync -m unittest discover -s tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: ruff check
        run: uvx ruff@0.17.4 check --output-format=github .
      - name: mypy (strict)
        run: |
          uv sync --locked
          uvx mypy@2.4.1 --python-executable .venv/bin/python
      - name: hook manifest
        run: uvx pre-commit@4.7.0 validate-manifest .pre-commit-hooks.yaml
      - name: file length of this repository
        run: uv run --locked check-file-length $(git ls-files '*.py' '*.pyi')
